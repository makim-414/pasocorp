<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8960b;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:0.4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg2)"/>

  <!-- Gallery wall - three framed artworks -->

  <!-- Frame 1 (left) - landscape orientation -->
  <g transform="translate(150, 120)">
    <!-- Outer frame -->
    <rect x="0" y="0" width="240" height="320" fill="none" stroke="#b8960b" stroke-width="2" opacity="0.6"/>
    <!-- Inner frame -->
    <rect x="12" y="12" width="216" height="296" fill="none" stroke="#8a6f08" stroke-width="1" opacity="0.4"/>
    <!-- Abstract artwork inside -->
    <rect x="20" y="20" width="200" height="280" fill="#111"/>
    <!-- Abstract composition - geometric shapes -->
    <circle cx="120" cy="140" r="70" fill="none" stroke="#b8960b" stroke-width="1.5" opacity="0.5"/>
    <circle cx="120" cy="140" r="50" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.3"/>
    <circle cx="120" cy="140" r="30" fill="#b8960b" opacity="0.15"/>
    <line x1="50" y1="80" x2="190" y2="200" stroke="#8a6f08" stroke-width="0.8" opacity="0.4"/>
    <line x1="190" y1="80" x2="50" y2="200" stroke="#8a6f08" stroke-width="0.8" opacity="0.4"/>
    <!-- Small label below -->
    <rect x="70" y="260" width="100" height="20" fill="#181818" rx="2"/>
    <line x1="80" y1="270" x2="160" y2="270" stroke="#444" stroke-width="1"/>
  </g>

  <!-- Frame 2 (center) - larger, featured piece -->
  <g transform="translate(460, 80)">
    <!-- Outer frame -->
    <rect x="0" y="0" width="280" height="400" fill="none" stroke="#b8960b" stroke-width="2.5" opacity="0.7"/>
    <!-- Inner frame -->
    <rect x="14" y="14" width="252" height="372" fill="none" stroke="#8a6f08" stroke-width="1" opacity="0.5"/>
    <!-- Abstract artwork -->
    <rect x="24" y="24" width="232" height="352" fill="#111"/>
    <!-- Abstract landscape -->
    <rect x="24" y="24" width="232" height="176" fill="#151515"/>
    <rect x="24" y="200" width="232" height="176" fill="#0e0e0e"/>
    <!-- Horizon line -->
    <line x1="24" y1="200" x2="256" y2="200" stroke="#b8960b" stroke-width="1" opacity="0.6"/>
    <!-- Abstract elements -->
    <rect x="80" y="120" width="120" height="160" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.25"/>
    <rect x="100" y="140" width="80" height="120" fill="#b8960b" opacity="0.08"/>
    <!-- Brushstroke-like elements -->
    <path d="M60,100 Q140,80 200,130 Q240,170 220,250" fill="none" stroke="#b8960b" stroke-width="2" opacity="0.3"/>
    <path d="M80,280 Q120,240 180,260 Q220,280 240,320" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.2"/>
    <!-- Label -->
    <rect x="90" y="340" width="100" height="20" fill="#181818" rx="2"/>
    <line x1="100" y1="350" x2="180" y2="350" stroke="#444" stroke-width="1"/>
  </g>

  <!-- Frame 3 (right) - portrait orientation -->
  <g transform="translate(810, 140)">
    <!-- Outer frame -->
    <rect x="0" y="0" width="220" height="280" fill="none" stroke="#b8960b" stroke-width="2" opacity="0.6"/>
    <!-- Inner frame -->
    <rect x="11" y="11" width="198" height="258" fill="none" stroke="#8a6f08" stroke-width="1" opacity="0.4"/>
    <!-- Abstract artwork -->
    <rect x="19" y="19" width="182" height="242" fill="#111"/>
    <!-- Minimalist abstract - stacked rectangles -->
    <rect x="40" y="50" width="140" height="40" fill="#b8960b" opacity="0.12"/>
    <rect x="50" y="100" width="120" height="35" fill="#d4af37" opacity="0.10"/>
    <rect x="60" y="145" width="100" height="30" fill="#8a6f08" opacity="0.15"/>
    <rect x="70" y="185" width="80" height="25" fill="#b8960b" opacity="0.08"/>
    <!-- Label -->
    <rect x="60" y="225" width="100" height="18" fill="#181818" rx="2"/>
    <line x1="70" y1="234" x2="150" y2="234" stroke="#444" stroke-width="1"/>
  </g>

  <!-- Magnifying glass / selection indicator on center piece -->
  <g transform="translate(600, 200)" opacity="0.5">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="18" y1="18" x2="35" y2="35" stroke="#d4af37" stroke-width="1.5"/>
  </g>

  <!-- Connecting dots between frames (curation flow) -->
  <g fill="#b8960b" opacity="0.3">
    <circle cx="420" cy="300" r="3"/>
    <circle cx="435" cy="300" r="2"/>
    <circle cx="447" cy="300" r="1.5"/>
    <circle cx="770" cy="300" r="3"/>
    <circle cx="785" cy="300" r="2"/>
    <circle cx="797" cy="300" r="1.5"/>
  </g>

  <!-- Floor reflection line -->
  <line x1="100" y1="520" x2="1100" y2="520" stroke="#222" stroke-width="0.5"/>

  <!-- Decorative corner elements -->
  <g stroke="#b8960b" stroke-width="1" opacity="0.3">
    <line x1="30" y1="30" x2="80" y2="30"/>
    <line x1="30" y1="30" x2="30" y2="80"/>
    <line x1="1170" y1="30" x2="1120" y2="30"/>
    <line x1="1170" y1="30" x2="1170" y2="80"/>
    <line x1="30" y1="570" x2="80" y2="570"/>
    <line x1="30" y1="570" x2="30" y2="520"/>
    <line x1="1170" y1="570" x2="1120" y2="570"/>
    <line x1="1170" y1="570" x2="1170" y2="520"/>
  </g>
</svg>
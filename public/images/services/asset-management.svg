<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8960b;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#8a6f08;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#b8960b;stop-opacity:0.4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#222" stroke-width="0.5" opacity="0.5">
    <line x1="200" y1="100" x2="200" y2="500"/>
    <line x1="350" y1="100" x2="350" y2="500"/>
    <line x1="500" y1="100" x2="500" y2="500"/>
    <line x1="650" y1="100" x2="650" y2="500"/>
    <line x1="800" y1="100" x2="800" y2="500"/>
    <line x1="950" y1="100" x2="950" y2="500"/>
    <line x1="200" y1="180" x2="950" y2="180"/>
    <line x1="200" y1="260" x2="950" y2="260"/>
    <line x1="200" y1="340" x2="950" y2="340"/>
    <line x1="200" y1="420" x2="950" y2="420"/>
    <line x1="200" y1="500" x2="950" y2="500"/>
  </g>

  <!-- Chart area background -->
  <rect x="200" y="100" width="750" height="400" fill="none" stroke="#333" stroke-width="1"/>

  <!-- Portfolio value trend line (ascending) -->
  <polyline points="200,450 300,420 400,380 500,350 550,300 600,320 700,250 750,220 850,180 950,150"
    fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Area fill under the line -->
  <polygon points="200,450 300,420 400,380 500,350 550,300 600,320 700,250 750,220 850,180 950,150 950,500 200,500"
    fill="url(#gold)" opacity="0.08"/>

  <!-- Data points -->
  <g fill="#b8960b">
    <circle cx="200" cy="450" r="4"/>
    <circle cx="300" cy="420" r="4"/>
    <circle cx="400" cy="380" r="4"/>
    <circle cx="500" cy="350" r="4"/>
    <circle cx="550" cy="300" r="4"/>
    <circle cx="600" cy="320" r="4"/>
    <circle cx="700" cy="250" r="4"/>
    <circle cx="750" cy="220" r="4"/>
    <circle cx="850" cy="180" r="4"/>
    <circle cx="950" cy="150" r="4"/>
  </g>

  <!-- Secondary trend line (benchmark) -->
  <polyline points="200,440 350,410 500,370 650,340 800,310 950,290"
    fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="8,6" stroke-linejoin="round"/>

  <!-- Pie chart (portfolio allocation) -->
  <g transform="translate(120,300)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#333" stroke-width="1"/>
    <!-- Segments -->
    <path d="M0,-60 A60,60 0 0,1 52,30 L0,0 Z" fill="#b8960b" opacity="0.7"/>
    <path d="M52,30 A60,60 0 0,1 -30,52 L0,0 Z" fill="#8a6f08" opacity="0.6"/>
    <path d="M-30,52 A60,60 0 0,1 -55,-24 L0,0 Z" fill="#d4af37" opacity="0.4"/>
    <path d="M-55,-24 A60,60 0 0,1 0,-60 L0,0 Z" fill="#666" opacity="0.5"/>
  </g>

  <!-- Value labels on Y-axis -->
  <g fill="#555" font-size="11" font-family="system-ui" text-anchor="end">
    <text x="190" y="185">500M</text>
    <text x="190" y="265">400M</text>
    <text x="190" y="345">300M</text>
    <text x="190" y="425">200M</text>
    <text x="190" y="505">100M</text>
  </g>

  <!-- Decorative corner elements -->
  <g stroke="#b8960b" stroke-width="1" opacity="0.3">
    <line x1="30" y1="30" x2="80" y2="30"/>
    <line x1="30" y1="30" x2="30" y2="80"/>
    <line x1="1170" y1="30" x2="1120" y2="30"/>
    <line x1="1170" y1="30" x2="1170" y2="80"/>
    <line x1="30" y1="570" x2="80" y2="570"/>
    <line x1="30" y1="570" x2="30" y2="520"/>
    <line x1="1170" y1="570" x2="1120" y2="570"/>
    <line x1="1170" y1="570" x2="1170" y2="520"/>
  </g>
</svg>